name: Generate APK
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:
    inputs:
      stacktrace:
        description: Run Gradle with --stacktrace
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          add-job-summary: never
          cache-cleanup: on-success
      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p .signing
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > .signing/release.jks
          else
            # No secrets: fixed debug keystore tracked in the repo, so every build upgrades the previous one in place
            cp app/debug.keystore .signing/release.jks
            KEYSTORE_PASSWORD=android KEY_ALIAS=headunit KEY_PASSWORD=android
          fi
          { echo "KEYSTORE_PATH=../.signing/release.jks"; echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"; echo "KEY_ALIAS=$KEY_ALIAS"; echo "KEY_PASSWORD=$KEY_PASSWORD"; } >> "$GITHUB_ENV"
      - name: Guard rails
        run: |
          # The launcher must never take audio focus or play sounds (radio, music and Vela voice prompts keep priority).
          if grep -rnE 'requestAudioFocus|AudioFocusRequest|SoundPool|MediaPlayer|ToneGenerator|playSoundEffect' app/src --exclude=MusicPlayer.kt; then
            echo "::error::audio focus / sound APIs are forbidden in this launcher"; exit 1
          fi
      - name: Build
        env:
          VERSION_CODE: ${{ github.run_number }}
          ST: ${{ inputs.stacktrace && '--stacktrace' || '' }}
        run: |
          set -o pipefail
          [[ "$GITHUB_REF" == refs/tags/v* ]] && export VERSION_NAME="${GITHUB_REF_NAME#v}"
          ./gradlew assembleRelease --no-daemon --no-configuration-cache --parallel --build-cache -Pkotlin.compiler.execution.strategy=in-process "-Dorg.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8 -XX:+UseParallelGC" --warning-mode summary --console=plain $ST 2>&1 | python3 -u .github/scripts/stamp.py | tee build.log
      - name: Task times
        if: always()
        run: |
          touch build.log
          python3 .github/scripts/task_times.py build.log >> "$GITHUB_STEP_SUMMARY"
      - name: Failure summary
        if: failure()
        run: |
          touch build.log
          { echo '### Build failed'; echo '```'
            grep -E '(^|\] )e: |FAILED|BUILD' build.log | head -40
            grep -A10 'What went wrong' build.log | head -30; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify ABIs
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BAD="$(unzip -Z1 "$APK" | grep '^lib/' | grep -vE '^lib/(armeabi-v7a|arm64-v8a)/' || true)"
          [ -z "$BAD" ] || { echo "::error::unexpected native ABIs:"; echo "$BAD"; exit 1; }
          echo "native libs: $(unzip -Z1 "$APK" | grep -c '^lib/' || true)"
      - name: Verify signature
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APK=app/build/outputs/apk/release/app-release.apk
          echo "$APK"; "$BT/apksigner" verify --print-certs "$APK" | grep SHA-256
      - name: Name and summary
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          [[ "$GITHUB_REF" == refs/tags/v* ]] && VERSION_NAME="${GITHUB_REF_NAME#v}"
          VER="${VERSION_NAME:-$(sed -n 's/.*"VERSION_NAME") ?: "\([^"]*\)".*/\1/p' app/build.gradle.kts)}"
          NAME="headunit-launcher-${VER}-b${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}.apk"
          cp "$APK" "$NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
          { echo "### $NAME"
            echo "- Size: $(du -h "$NAME" | cut -f1)"
            echo "- Commit: \`${GITHUB_SHA::7}\` on \`${GITHUB_REF_NAME}\`"
            echo "- Signer: \`$("$BT/apksigner" verify --print-certs "$NAME" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)\`"
          } >> "$GITHUB_STEP_SUMMARY"
      # Bare APK (archive: false): the download is the installable file. The zipped copy is only the hand-over to the publish job.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
          archive: false
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: apk-handover
          path: ${{ env.APK_NAME }}
          retention-days: 1
          if-no-files-found: error
  # Publishes only when the build is green: the `latest` tag equal to HEAD means a green commit.
  publish:
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read  # gh run download
    steps:
      - name: Fetch APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n apk-handover -D out && ls out
      - name: Rolling release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The new APK goes up before the old one is removed: a failed upload never leaves `latest` empty.
          NOTES="Build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})"
          if gh release view latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload latest out/*.apk -R "$GITHUB_REPOSITORY" --clobber
            # Move the tag to this commit, then drop the previous builds' assets.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true >/dev/null \
              || gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/latest -f sha="$GITHUB_SHA" >/dev/null
            gh release edit latest -R "$GITHUB_REPOSITORY" --prerelease --title "Ultima build" --notes "$NOTES"
            NEW="$(basename out/*.apk)"
            gh release view latest -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -vxF "$NEW" \
              | xargs -r -I{} gh release delete-asset latest {} -R "$GITHUB_REPOSITORY" -y || true
          else
            gh release create latest out/*.apk -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" --title "Ultima build" --notes "$NOTES"
          fi
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/*.apk -R "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" out/*.apk -R "$GITHUB_REPOSITORY" --clobber
  prune:
    needs: [publish]
    if: success()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Prune old runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # keep only the current run
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" --jq '.workflow_runs[].id' \
            | grep -vx "$GITHUB_RUN_ID" | xargs -r -P4 -I{} gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/{}" || true
